<!DOCTYPE html>
<html lang="zh-CN" class="page-lock">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Andrew & Dora 婚礼请柬 · 2026.11.14 · 珠海横琴湾酒店">
<meta name="theme-color" content="#f0eadf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="assets/preview.jpg">

<!-- 与英文版互为 alternate（英文站是子目录 /en/，共用同一套 CSS/JS/视频） -->
<link rel="canonical" href="https://andrew-dora-wedding.pages.dev/">
<link rel="alternate" hreflang="zh-CN" href="https://andrew-dora-wedding.pages.dev/">
<link rel="alternate" hreflang="en" href="https://andrew-dora-wedding.pages.dev/en/">

<!-- 微信 / 社交分享（og:image 用国内站绝对地址：国外主机的图微信抓不到） -->
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="Andrew & Dora 的婚礼邀请函">
<meta property="og:description" content="2026.11.14 · 珠海·横琴湾酒店·婚礼亭 — 好久不见，婚礼见！">
<meta property="og:image" content="https://andrew-dora-wedding.pages.dev/assets/preview.jpg">
<meta property="og:url" content="https://andrew-dora-wedding.pages.dev/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://andrew-dora-wedding.pages.dev/assets/preview.jpg">
<title>Andrew &amp; Dora · Save the Date</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="lang-zh">

<div id="app">
  <!-- 开启请柬封面 -->
  <div id="cover">
    <div class="cover-inner">
      <div class="cover-doodle">✦</div>
      <h1 class="cover-names">Andrew<span class="amp">&amp;</span>Dora</h1>
      <div class="cover-divider">─────  ♥  ─────</div>
      <p class="cover-date">2026 . 11 . 14</p>
      <p class="cover-venue">珠海 · 横琴湾酒店 · 婚礼亭</p>
      <button id="open-btn" type="button">开启请柬</button>
      <p class="cover-hint"> swipe up </p>
    </div>
  </div>

  <!-- 花瓣飘落 -->
  <div id="petals" aria-hidden="true"></div>

  <!-- 整屏翻页容器：一滑一页，自动吸附 -->
  <main id="pager">

    <!-- 1 / 4 · 开场动图（豆包生成 · 已去水印 · 静音自动循环）
         ⚠️ 原「拱门下起舞」那一屏（pg1）已删：视频就是这一屏的动图版，
         两者内容重复，留着会连着两屏看到同一个画面。
         2026-09-22：删掉了原先压在视频下方的纸色「新郎 / 新娘」名条 ——
         它独立占掉约 68px 高度，把视频挤小；而画面里两个人正好站在视频
         最底部（裙摆贴着下沿），名条紧贴着他们，看着就像把视频压住了。
         2026-09-24：视频不再是「独占整屏」，而是和后两屏的页面图**同一个
         盒子**（见 style.css 的 .hero-stage）—— 视频两侧各裁 7.8% 换得与
         长图完全等宽等高，否则首屏铺满、内页只有 91% 宽，看着一大小。
         中文全名（吴彦良 / 魏雪纯）按主人要求不再出现，第一屏的名字由
         视频画面自带的手写体 "Andrew & Dora" 承担。 -->
    <section class="page page-hero">
      <div class="hero-stage">
        <video class="hero-video" muted loop playsinline preload="auto"
               poster="assets/hero-poster.jpg" aria-label="Andrew &amp; Dora 婚礼动画">
          <source src="assets/hero.mp4" type="video/mp4">
          <source src="assets/hero.webm" type="video/webm">
        </video>
        <div class="scroll-hint" aria-hidden="true"><span></span></div>
      </div>
    </section>

    <!-- 2 / 4 · Save the Date + Timeline -->
    <section class="page">
      <img class="page-img" src="assets/pg2.webp"
           alt="Save the Date：我们诚挚地邀请陪伴我们度过生命中每一段闪亮岁月的你能够到场见证这一天。Timeline：16:00 签到茶歇 / 16:30 户外仪式 / 18:00 晚宴 / 19:30 After Party">
    </section>

    <!-- 3 / 4 · 日期场地着装 + 寄语 -->
    <section class="page">
      <img class="page-img" src="assets/pg3.webp"
           alt="2026.11.14 珠海·横琴湾酒店·婚礼亭 · Dress Code 米色/浅卡其/浅黄/浅粉/浅蓝等低饱和颜色服装 · Cheers To Love 好久不见，婚礼见！">
    </section>

    <!-- 4 / 4 · 操作（只留三个入口：回复出席 / 宾客须知 / 保存到日历）
         ⚠️ 2026-09-22 按主人要求把操作屏从 5 个入口砍到 3 个（被删的两条文案
         这里故意不复述，免得以后 grep 查残留时误报）：
         - 砍掉「领卡」入口：钱包卡是按人一对一发专属链接的，正页不需要总入口
           （宾客须知页脚仍留了一个入口，方便没收到链接的人自己找回）
         - 砍掉「导航」入口：宾客须知里已经有高德 / 苹果 / Google 三个地图入口
         改这里必须同步 en/index.html 与 build_paged_preview.py，否则预览图和线上对不上。
         RSVP 从次级金色描边升级为主按钮（原主按钮就是被砍掉的那个），它现在是唯一的正式 CTA。 -->
    <section class="page page-actions">
      <button type="button" class="btn btn-primary" style="--i:0" id="rsvp-btn"
              aria-haspopup="dialog" aria-controls="rsvp-sheet">
        <span class="ico">✅</span> 回复出席 RSVP
      </button>
      <a class="btn btn-guide" style="--i:1" href="notice.html">
        <span class="ico">📋</span> 宾客须知 · 地点 / 流程 / 着装
      </a>
      <a class="btn" style="--i:2" id="cal-btn" href="assets/wedding.ics" download="andrew-dora-wedding.ics">
        <span class="ico">📅</span> 保存到日历
      </a>
      <p class="thanks" style="--i:3">期待与你见面 ♡</p>
    </section>

  </main>

  <!-- 回复出席面板：在主页里直接收「名字 + 3 题」，不跳转。
       提交 → 同域 /api/rsvp（Cloudflare Pages Function）→ **本项目自带的 Cloudflare D1**
       （binding `DB`，表 rsvp；见 functions/api/rsvp.js）。
       2026-09-24 从飞书 API 换成 D1：写飞书表要「企业自建应用」的 App ID/Secret
       （建应用 → 开权限 → **发布版本** → 加协作者，四步漏一步就写不进去），
       而绕开它的另一条路（表里的 webhook 自动化）**要付费套餐**。
       D1 是本项目自带的 SQLite，免费额度用不完，POST 不需要任何凭据。
       ?n=名字 预填进「你的名字」输入框，宾客可以改。
       ⚠️ 2026-09-24 起面板上**不再问「邀请编号」**：那道题只在链接没带 ?c= 时才露出来
       （转发给别人、从裸域名进），而那种情况下宾客根本不知道自己的编号 —— 问了也白问，
       还会挡住提交。编号改成**只从专属链接静默带上**：有 ?c= 就写进库（主人侧照样精确
       对账），没有就不写，由服务端按姓名兜底认领。
       主人侧查看回复：rsvp-admin.html（要口令，口令由 deploy-cf.sh --setup-d1 生成）。
       ⚠️ GitHub Pages 那份没有 Function，提交会失败 —— 面板会当场退回飞书表单
       （data-fallback），所以两个站都能用，只是 GH 站少一步直达。
       ⚠️ 文案改这里要同步 en/index.html；逻辑共用 rsvp.js，不在这里写死。
       右下角 data-* 是给 rsvp.js 读的字符串（{名字}/{人数} 是占位符）。 -->
  <div id="rsvp-sheet" class="sheet" hidden
       data-api="api/rsvp"
       data-fallback="https://my.feishu.cn/share/base/form/shrcn5d7sc5fYeMeP18VhxHOYEh"
       data-hi="你好，{name} ♡"
       data-hi-anon="谢谢你的回复 ♡"
       data-need-attend="先告诉我们你来不来哦"
       data-need-name="请写下你的名字 ♡"
       data-ok-yes="收到啦，我们等你 ♡"
       data-ok-yes-sub="已记录：{party} 位"
       data-ok-no="收到，很遗憾这次见不到你 ♡"
       data-ok-no-sub="回复已记录，谢谢你告诉我们"
       data-err="没能存下你的回复（是我们这边的问题，不是你的网络）。稍后再试一次，或"
       data-err-alt="直接用飞书表单回复 →"
       data-fallback-name="你的名字"
       data-fallback-code="邀请编号"
       data-off-title="这个页面暂时收不了回复"
       data-off-sub="刚没能连上我们的服务器。点下面这个按钮，用飞书表单回复也一样 —— 你的名字已经帮你带过去了。"
       data-off-cta="打开回复表单 →"
       data-sending="发送中…">

    <div class="sheet-veil" data-rsvp-close></div>

    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="rsvp-q1">
      <button type="button" class="sheet-x" data-rsvp-close aria-label="关闭">×</button>

      <form id="rsvp-form" novalidate>
        <p class="sheet-hi" id="rsvp-hi"></p>

        <!-- 名字排第一题：专属链接会预填好，宾客只是"看一眼/顺手改"；
             链接被转发出去（没有 ?n=）时，这里就是他们唯一的报名入口 ——
             也是**没有编号时服务端唯一的认人依据**，所以是必填。 -->
        <div class="q">
          <p class="q-label" id="rsvp-q0">你的名字</p>
          <input id="rsvp-name" type="text" maxlength="40" autocomplete="name"
                 aria-labelledby="rsvp-q0" placeholder="写下你的名字">
        </div>

        <div class="q" role="radiogroup" aria-labelledby="rsvp-q1">
          <p class="q-label" id="rsvp-q1">你会来吗？</p>
          <div class="picks">
            <label class="pick">
              <input type="radio" name="attend" value="yes">
              <span>一定到 ♡</span>
            </label>
            <label class="pick">
              <input type="radio" name="attend" value="no">
              <span>这次来不了</span>
            </label>
          </div>
        </div>

        <div class="q" id="rsvp-party-wrap" role="group" aria-labelledby="rsvp-q2" hidden>
          <p class="q-label" id="rsvp-q2">一共几位？（含你自己）</p>
          <div class="stepper">
            <button type="button" class="step" data-step="-1" aria-label="减少">−</button>
            <output id="rsvp-party">1</output>
            <button type="button" class="step" data-step="1" aria-label="增加">＋</button>
          </div>
        </div>

        <!-- 忌口和"几位"一样，只在"一定到"时才有意义 —— 说"来不了"的人
             不该被追问吃什么（2026-09-24 主人要求）。两者都由 rsvp.js
             的 syncAttend() 一起显隐。 -->
        <div class="q" id="rsvp-allergy-wrap" hidden>
          <p class="q-label" id="rsvp-q3">有过敏或忌口吗？</p>
          <textarea id="rsvp-allergy" rows="2" maxlength="200"
                    aria-labelledby="rsvp-q3" placeholder="没有可以留空"></textarea>
        </div>

        <button type="submit" class="sheet-send" id="rsvp-send">发送回复</button>
        <p class="sheet-note" id="rsvp-note" role="status" aria-live="polite"></p>
      </form>

      <!-- 后端不可用时的替身（打开面板时预检不通就换成这块）：
           宁可少收一条，也不让宾客填完三题才发现发不出去。 -->
      <div class="sheet-off" id="rsvp-off" hidden>
        <p class="sheet-off-t" id="rsvp-off-t"></p>
        <p class="sheet-off-s" id="rsvp-off-s"></p>
        <a class="sheet-send" id="rsvp-off-a" href="#" target="_blank" rel="noopener"></a>
      </div>

      <div class="sheet-done" id="rsvp-done" hidden>
        <div class="done-mark">♡</div>
        <p class="done-title" id="rsvp-done-title"></p>
        <p class="done-sub" id="rsvp-done-sub"></p>
      </div>
    </div>
  </div>

  <!-- 右侧翻页圆点（静态写好，JS 只负责切换当前页，避免脚本异常导致导航丢失）
       个数必须与 .page 数一致 -->
  <nav id="dots" aria-label="翻页导航">
    <button type="button" aria-label="第 1 页" aria-current="true"></button>
    <button type="button" aria-label="第 2 页"></button>
    <button type="button" aria-label="第 3 页"></button>
    <button type="button" aria-label="第 4 页"></button>
  </nav>

  <!-- 语言切换：跳到英文版（相对路径，pages.dev 与 github.io 子目录部署都成立） -->
  <a class="lang-pill" href="en/">EN</a>
</div>

<script src="main.js"></script>
<script src="rsvp.js"></script>
</body>
</html>
