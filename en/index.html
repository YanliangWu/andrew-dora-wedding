<head>

<link rel="alternate" hreflang="en" href="https://andrew-dora-wedding.pages.dev/en/">

<!-- 微信 / 社交分享 -->
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Andrew &amp; Dora · Wedding Invitation">
<meta property="og:description" content="November 14, 2026 · Hengqin Bay Hotel, Zhuhai — We would love to have you with us.">
<meta property="og:image" content="https://andrew-dora-wedding.pages.dev/assets/preview.jpg">
<meta property="og:url" content="https://andrew-dora-wedding.pages.dev/en/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://andrew-dora-wedding.pages.dev/assets/preview.jpg">
<title>Andrew &amp; Dora · Save the Date</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="lang-en">

<div id="app">
  <!-- 开启请柬封面 -->
  <div id="cover">
    <div class="cover-inner">
      <div class="cover-doodle">✦</div>
      <h1 class="cover-names">Andrew<span class="amp">&amp;</span>Dora</h1>
      <div class="cover-divider">─────  ♥  ─────</div>
      <p class="cover-date">November 14, 2026</p>
      <p class="cover-venue">Zhuhai · Hengqin Bay Hotel · Wedding Pavilion</p>
      <button id="open-btn" type="button">Open Invitation</button>
      <p class="cover-hint"> swipe up </p>
    </div>
  </div>

  <!-- 花瓣飘落 -->
  <div id="petals" aria-hidden="true"></div>

  <!-- 整屏翻页容器：一滑一页，自动吸附（样式与逻辑与中文版完全共用） -->
  <main id="pager">

    <!-- 1 / 4 · Opening animation（shared with the Chinese version — the clip is language-neutral）
         ⚠️ The still image that used to sit here (arch + first dance) is intentionally not used:
         the video *is* the animated version of that very scene.
         2026-09-22: the paper-coloured "GROOM / BRIDE · Andrew Wu / Dora Wei" strip
         below the video has been removed — it took a fixed ~68px band, squeezing the
         clip, and since the couple stands at the very bottom of the frame the strip
         read as if it were covering them.
         2026-09-24: the clip no longer owns the full screen — it now sits in the
         SAME box as the page images on the next two screens (see .hero-stage in
         style.css), cropping 7.8% off each side so that video and artwork render at
         exactly the same size. Before this they were full-bleed vs 91% wide.
         The names come from the handwritten "Andrew & Dora" baked into the clip. -->
    <section class="page page-hero">
      <div class="hero-stage">
        <video class="hero-video" muted loop playsinline preload="auto"
               poster="../assets/hero-poster.jpg" aria-label="Andrew &amp; Dora wedding animation">
          <source src="../assets/hero.mp4" type="video/mp4">
          <source src="../assets/hero.webm" type="video/webm">
        </video>
        <div class="scroll-hint" aria-hidden="true"><span></span></div>
      </div>
    </section>

    <!-- 2 / 4 · Save the Date + Timeline -->
    <section class="page">
      <img class="page-img" src="assets/pg2.webp"
           alt="Save the Date: You have shared in the brightest moments of our lives, and we would be honored to have you by our side to witness this special day. Timeline: 16:00 Welcome Tea &amp; Check-in / 16:30 Outdoor Ceremony / 18:00 Dinner Banquet / 19:30 After Party">
    </section>

    <!-- 3 / 4 · Date, venue, dress code + message -->
    <section class="page">
      <img class="page-img" src="assets/pg3.webp"
           alt="November 14, 2026 · Zhuhai · Hengqin Bay Hotel · Wedding Pavilion · Dress Code: soft, muted tones — cream, light khaki, pale yellow, blush pink, light blue · Cheers To Love">
    </section>

    <!-- 4 / 4 · Actions (three entries only: RSVP / Guest Info / Calendar)
         ⚠️ 2026-09-22: the action screen went from six entries down to three.
         Dropped the wallet-pass link (each guest gets a personal pass URL, so
         the main page needs no general entry) and both map links (Guest Info
         already offers Amap / Apple Maps / Google Maps). The removed labels are
         deliberately not quoted here, so future greps for leftovers stay clean.
         Keep in sync with index.html and build_paged_preview.py.
         RSVP was promoted to the primary button; it is now the only real CTA. -->
    <section class="page page-actions">
      <button type="button" class="btn btn-primary" style="--i:0" id="rsvp-btn"
              aria-haspopup="dialog" aria-controls="rsvp-sheet">
        <span class="ico">✅</span> Reply to RSVP
      </button>
      <a class="btn btn-guide" style="--i:1" href="../notice-en.html">
        <span class="ico">📋</span> Guest Info
      </a>
      <a class="btn" style="--i:2" id="cal-btn" href="../assets/wedding.ics" download="andrew-dora-wedding.ics">
        <span class="ico">📅</span> Add to Calendar
      </a>
      <p class="thanks" style="--i:3">See you there ♡</p>
    </section>

  </main>

  <!-- RSVP sheet: collects name + three questions on the main page, no redirect.
       Submits to same-origin /api/rsvp (Cloudflare Pages Function) which writes into
       **this project's own Cloudflare D1** (binding `DB`, table `rsvp`; see
       functions/api/rsvp.js). Switched from the Feishu API on 2026-09-24: writing
       that table needs a Feishu custom app (create app → grant bitable:app →
       **publish a version** → add the app as a Base collaborator), and the way
       around it (the Base "webhook received" automation) **needs a paid plan**.
       D1 is a SQLite that ships with this project — generous free tier, no
       credentials needed for POST. ?n=<name> is prefilled into the "Your name"
       field and can be edited.
       Owner view: rsvp-admin.html (needs the admin key printed by
       `deploy-cf.sh --setup-d1`).
       ⚠️ Since 2026-09-24 the sheet no longer asks for an invitation code: that
       question only appeared when the link carried no ?c= (a forwarded link or a
       bare domain) — exactly when a guest has no idea what their code is — and it
       blocked submission. The code is now taken silently from the personal link
       when present (?c=), otherwise omitted and reconciled by name server-side.
       ⚠️ GitHub Pages has no Functions, so submits fail there — the sheet falls
       back to the Feishu form (data-fallback) on the spot.
       ⚠️ Keep the copy in sync with index.html; the logic lives in rsvp.js. -->
  <div id="rsvp-sheet" class="sheet" hidden
       data-api="../api/rsvp"
       data-fallback="https://my.feishu.cn/share/base/form/shrcnrQ4Bxe6LKebUHs04peSceh"
       data-hi="Hi {name} ♡"
       data-hi-anon="Thanks for replying ♡"
       data-need-attend="Please pick one first"
       data-need-name="Please write your name ♡"
       data-ok-yes="Wonderful — see you there ♡"
       data-ok-yes-sub="Recorded: {party} guest(s)"
       data-ok-no="Thanks for letting us know ♡"
       data-ok-no-sub="Your reply has been recorded"
       data-err="We couldn't save your reply — that's on our side, not your connection. Please try again in a moment, or"
       data-err-alt="use the Feishu form instead →"
       data-fallback-name="Your name"
       data-fallback-code="Invitation code"
       data-off-title="This page can't collect replies right now"
       data-off-sub="We couldn't reach our server just now. The button below opens the Feishu form instead — your name is already filled in."
       data-off-cta="Open the form →"
       data-sending="Sending…">

    <div class="sheet-veil" data-rsvp-close></div>

    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="rsvp-q1">
      <button type="button" class="sheet-x" data-rsvp-close aria-label="Close">×</button>

      <form id="rsvp-form" novalidate>
        <p class="sheet-hi" id="rsvp-hi"></p>

        <!-- Name comes first: the personal link prefills it, and it's the only
             way we can identify a guest opening a forwarded link (no ?n=) — and
             now also the server's only identity signal when there is no ?c=,
             which is why it is required. -->
        <div class="q">
          <p class="q-label" id="rsvp-q0">Your name</p>
          <input id="rsvp-name" type="text" maxlength="40" autocomplete="name"
                 aria-labelledby="rsvp-q0" placeholder="Write your name">
        </div>

        <div class="q" role="radiogroup" aria-labelledby="rsvp-q1">
          <p class="q-label" id="rsvp-q1">Will you be joining us?</p>
          <div class="picks">
            <label class="pick">
              <input type="radio" name="attend" value="yes">
              <span>Count me in ♡</span>
            </label>
            <label class="pick">
              <input type="radio" name="attend" value="no">
              <span>Can't make it</span>
            </label>
          </div>
        </div>

        <div class="q" id="rsvp-party-wrap" role="group" aria-labelledby="rsvp-q2" hidden>
          <p class="q-label" id="rsvp-q2">How many of you? (including yourself)</p>
          <div class="stepper">
            <button type="button" class="step" data-step="-1" aria-label="Fewer">−</button>
            <output id="rsvp-party">1</output>
            <button type="button" class="step" data-step="1" aria-label="More">＋</button>
          </div>
        </div>

        <div class="q">
          <p class="q-label" id="rsvp-q3">Any allergies or dietary restrictions?</p>
          <textarea id="rsvp-allergy" rows="2" maxlength="200"
                    aria-labelledby="rsvp-q3" placeholder="Leave blank if none"></textarea>
        </div>

        <button type="submit" class="sheet-send" id="rsvp-send">Send reply</button>
        <p class="sheet-note" id="rsvp-note" role="status" aria-live="polite"></p>
      </form>

      <!-- Swap-in used when the preflight check finds no backend (the GitHub Pages
           mirror has no Functions): never let a guest fill three answers and only
           then discover the send fails. -->
      <div class="sheet-off" id="rsvp-off" hidden>
        <p class="sheet-off-t" id="rsvp-off-t"></p>
        <p class="sheet-off-s" id="rsvp-off-s"></p>
        <a class="sheet-send" id="rsvp-off-a" href="#" target="_blank" rel="noopener"></a>
      </div>

      <div class="sheet-done" id="rsvp-done" hidden>
        <div class="done-mark">♡</div>
        <p class="done-title" id="rsvp-done-title"></p>
        <p class="done-sub" id="rsvp-done-sub"></p>
      </div>
    </div>
  </div>

  <!-- 右侧翻页圆点（静态写好，JS 只负责切换当前页，避免脚本异常导致导航丢失）
       个数必须与 .page 数一致 -->
  <nav id="dots" aria-label="Page navigation">
    <button type="button" aria-label="Page 1" aria-current="true"></button>
    <button type="button" aria-label="Page 2"></button>
    <button type="button" aria-label="Page 3"></button>
    <button type="button" aria-label="Page 4"></button>
  </nav>

  <!-- 语言切换：跳回中文版（用相对路径，pages.dev 与 github.io 子目录部署都成立） -->
  <a class="lang-pill" href="../">中文</a>
</div>

<script src="../main.js"></script>
<script src="../rsvp.js"></script>
</body>
</html>
