<link rel="stylesheet" href="style.css">
</head>
<body class="lang-zh">

<div id="app">
  <!-- 开启请柬封面 -->
  <div id="cover">
    <div class="cover-inner">
      <div class="cover-doodle">✦</div>
      <h1 class="cover-names">Andrew<span class="amp">&amp;</span>Dora</h1>
      <div class="cover-divider">─────  ♥  ─────</div>
      <p class="cover-date">2026 . 11 . 14</p>
      <p class="cover-venue">珠海 · 横琴湾酒店 · 婚礼亭</p>
      <button id="open-btn" type="button">开启请柬</button>
      <p class="cover-hint"> swipe up </p>
    </div>
  </div>

  <!-- 花瓣飘落 -->
  <div id="petals" aria-hidden="true"></div>

  <!-- 整屏翻页容器：一滑一页，自动吸附 -->
  <main id="pager">

    <!-- 1 / 4 · 开场动图（豆包生成 · 已去水印 · 静音自动循环）
         ⚠️ 原「拱门下起舞」那一屏（pg1）已删：视频就是这一屏的动图版，
         两者内容重复，留着会连着两屏看到同一个画面。
         视频里那两行英文手写名是画面的一部分；中文全名（原第一屏图上的
         「新郎 吴彦良 / 新娘 魏雪纯」）另放在下方纸色名条里 ——
         实测视频 y95% 以下仍是人物与裙摆，压字会糊在人物身上。 -->
    <section class="page page-hero">
      <div class="hero-stage">
        <video class="hero-video" muted loop playsinline preload="auto"
               poster="assets/hero-poster.jpg" aria-label="Andrew &amp; Dora 婚礼动画">
          <source src="assets/hero.mp4" type="video/mp4">
          <source src="assets/hero.webm" type="video/webm">
        </video>
        <div class="scroll-hint" aria-hidden="true"><span></span></div>
      </div>

      <div class="hero-names">
        <div class="hn-col">
          <span class="hn-role">新郎 · GROOM</span>
          <span class="hn-name">吴彦良</span>
        </div>
        <span class="hn-heart" aria-hidden="true">♥</span>
        <div class="hn-col">
          <span class="hn-role">新娘 · BRIDE</span>
          <span class="hn-name">魏雪纯</span>
        </div>
      </div>
    </section>

    <!-- 2 / 4 · Save the Date + Timeline -->
    <section class="page">
      <img class="page-img" src="assets/pg2.webp"
           alt="Save the Date：我们诚挚地邀请陪伴我们度过生命中每一段闪亮岁月的你能够到场见证这一天。Timeline：16:00 签到茶歇 / 16:30 户外仪式 / 18:00 晚宴 / 19:30 After Party">
    </section>

    <!-- 3 / 4 · 日期场地着装 + 寄语 -->
    <section class="page">
      <img class="page-img" src="assets/pg3.webp"
           alt="2026.11.14 珠海·横琴湾酒店·婚礼亭 · Dress Codes 米白/浅卡其/浅粉等低饱和颜色服装 · Cheers To Love 好久不见，婚礼见！">
    </section>

    <!-- 4 / 4 · 操作 -->
    <section class="page page-actions">
      <a class="btn btn-primary" style="--i:0" href="card.html">
        <span class="ico">💳</span> 领取我的电子请柬卡
      </a>
      <a class="btn btn-guide" style="--i:1" href="notice.html">
        <span class="ico">🧳</span> 宾客须知 · 交通 / 证件 / 签证
      </a>
      <a class="btn" style="--i:2" id="cal-btn" href="assets/wedding.ics" download="andrew-dora-wedding.ics">
        <span class="ico">📅</span> 保存到日历
      </a>
      <a class="btn" style="--i:3" id="map-btn" target="_blank" rel="noopener"
         href="https://uri.amap.com/search?keyword=%E7%8F%A0%E6%B5%B7%E6%A8%AA%E7%90%B4%E6%B9%BE%E9%85%92%E5%BA%97&src=andrew-dora-wedding">
        <span class="ico">📍</span> 导航到婚礼亭
      </a>
      <p class="thanks" style="--i:4">期待与你见面 ♡</p>
    </section>

  </main>

  <!-- 右侧翻页圆点（静态写好，JS 只负责切换当前页，避免脚本异常导致导航丢失）
       个数必须与 .page 数一致 -->
  <nav id="dots" aria-label="翻页导航">
    <button type="button" aria-label="第 1 页" aria-current="true"></button>
    <button type="button" aria-label="第 2 页"></button>
    <button type="button" aria-label="第 3 页"></button>
    <button type="button" aria-label="第 4 页"></button>
  </nav>

  <!-- 语言切换：跳到英文版（相对路径，pages.dev 与 github.io 子目录部署都成立） -->
  <a class="lang-pill" href="en/">EN</a>
</div>

<script src="main.js"></script>
</body>
</html>
